name: Build_wheels
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15-intel, macos-14]
    steps:
      - uses: actions/checkout@v6
        with:
            persist-credentials: false
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_SKIP: "*musllinux*"
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0
          CIBW_TEST_SKIP: "*-win*"
          CIBW_TEST_REQUIRES: pytest
          # Try to install sklearn when the target supports it; otherwise skip the
          # sklearn compatibility module cleanly at runtime.
          CIBW_BEFORE_TEST: python -m pip install scikit-learn || true
          CIBW_TEST_SOURCES: "tests"
          CIBW_TEST_COMMAND: c++ -std=c++17 -O2 -pthread {project}/cpp/tests.cpp -o /tmp/aplr_cpp_tests && /tmp/aplr_cpp_tests && pytest {project}/tests/tests.py {project}/tests/test_sklearn_compatibility.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          retention-days: 7